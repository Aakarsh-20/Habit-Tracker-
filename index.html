<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="calendar.png">
</head>
<body>

  <h1>Habit Tracker</h1>
  <hr class="line-orange">

  <p id="greeting">Welcome!</p>

  <div class="counter-box">
    <p>Today's habits completed</p>
    <h2><span id="done">0</span> / <span id="total">0</span></h2>
  </div>

  <hr class="line-light">

  <h2>Habits I'm tracking</h2>
  <div id="habitList"></div>

  <hr class="line-light">

  <div class="form-box">
    <h3>Add a new habit</h3>

    <label for="nameInput">Habit name:</label>
    <input type="text" id="nameInput" placeholder="e.g. Daily Exercise">
    <p id="error" class="error">Please type a habit name first!</p>

    <label for="descInput">Description (optional):</label>
    <textarea id="descInput" rows="4" placeholder="e.g. 20 pushups, 15 min walk, 7:00 AM"></textarea>

    <button id="addBtn">+ Add habit</button>
  </div>

  <hr class="line-light">

  <h2>Consistency log</h2>
  <p class="small">Last 7 days</p>

  <div class="table-box">
    <table>
      <thead>
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
