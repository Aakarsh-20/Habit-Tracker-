<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Content" content="WebDev Project">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="calendar.png">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">

    <header class="header">
      <h1>Habit Tracker</h1>
    </header>

    <hr class="partition-bold">

    <div class="greeting-section">
      <p id="greetingText" class="greeting-text">Welcome!</p>
    </div>

    <div class="stats-box">
      <div class="stats-title">Today's Habits Completed</div>
      <div class="stats-counter">
        <span id="completedCount">0</span> / <span id="totalCount">0</span>
      </div>
      <div class="stats-note">Habits done today</div>
    </div>

    <hr class="partition-light">

    <section class="habits-section">
      <div class="section-header">
        <h2>Habits Currently Tracking</h2>
      </div>

      <div id="habitList" class="habit-list"></div>
    </section>

    <hr class="partition-light">

    <section class="new-habit-box">
      <h3>Add a New Habit</h3>
      
      <form id="newHabitForm" novalidate>
        <div class="form-group">
          <label for="habitTitleInput">Habit Name:</label>
          <input 
            type="text" 
            id="habitTitleInput" 
            placeholder="e.g. Daily Exercise">
          
            <div id="nameErrorMsg" class="error-msg hidden">
            Error: Habit name cannot be empty. Please enter a habit name.
          </div>
        </div>

        <div class="form-group">
          <label for="habitDescInput">Habit Description (Optional):</label>
          <textarea 
            id="habitDescInput" 
            rows="4"
            placeholder="Pointers to include:&#10;• Goal: 20 pushups and 15 min walk&#10;• Preferred time: 7:00 AM&#10;• Rule: Stay consistent 5 days a week&#10;• Note: Drink water beforehand"
          ></textarea>
        </div>

        <button type="submit" id="addHabitBtn" class="btn btn-primary">+ Add New Habit</button>
      </form>
    </section>

    <hr class="partition-light">

    <section class="consistency-section">
      <h2>Consistency Log</h2>
      <p class="section-subtext">Past 7 days record of how many tasks done</p>

      <div class="table-wrapper">
        <table class="consistency-table">
          <thead>
            <tr id="tableHeaderRow">
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
